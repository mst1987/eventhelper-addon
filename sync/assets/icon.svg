<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Die EventHelper-Marke (Logo-Canvas Okt. 2026, Richtung D "Kalender mit
       Haken"): der Kalender der Raids mit dem Haken der Anmeldung, auf dem
       violett-türkisen Verlauf der Webseite. Dieselbe Marke ist das Favicon
       der Webseite (eventhelper src/web-client/public/favicon.svg).
       Quelle von drei Dingen, alle per npm run build:icon (scripts/render-icon.js):
       icon.ico (Programm-Icon der .exe) und die beiden Bilder des Addons
       (addon/EventHelperSync/media/logo.tga, logo-round.tga). Das Favicon des
       Fensters (FAVICON in lib/webui-page.js) von Hand mitziehen. -->
  <defs>
    <linearGradient id="g" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#8a7cff"/>
      <stop offset="1" stop-color="#35d6c4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <g fill="none" stroke="#130f26" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="17" width="40" height="36" rx="6"/>
    <path d="M23 11 V21 M41 11 V21 M12 28 H52"/>
    <path d="M23.5 40.5 L29 46 L40.5 34.5"/>
  </g>
</svg>
